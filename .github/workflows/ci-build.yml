name: CI-Build

on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Prepare source directories for sonar
        run: |
          mkdir -p hamcrest-matcher-generator/src/{main,test}/{java,kotlin}
          mkdir -p matcher-generator-annotations/src/{main,test}/{java,kotlin}
          mkdir -p matcher-generator-core/src/{main,test}/{java,kotlin}
        if: success()

      - name: Build
        run: ./mvnw -B clean install -DskipTests
        if: success()

      - name: Test
        # The poms bind the JaCoCo agents and the reports Sonar reads (target/site/jacoco and jacoco-it) to the lifecycle.
        run: ./mvnw -B verify
        if: success()

      # Temporarily non-blocking: SONAR_TOKEN is no longer authorized. The SonarCloud setup is decided in
      # wayfinder map #52 ("Quality gates: what blocks a merge and what runs locally", #62).
      - name: Sonar
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B sonar:sonar -am --projects "hamcrest-matcher-generator,matcher-generator-core,matcher-generator-annotations"
        if: success()

  verify-matrix:
    name: Verify JDK ${{ matrix.role }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: "17"
            java-version: "17"
          - role: "21"
            java-version: "21"
          - role: "25"
            java-version: "25"
          # Newest GA JDK. setup-java takes no "latest" alias; Renovate bumps this version (#134).
          - role: latest
            java-version: "27"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.role }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-jdk${{ matrix.role }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-jdk${{ matrix.role }}-

      - name: Verify
        run: ./mvnw -B clean verify

  release-dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-release-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-release-

      # The CycloneDX skip and the missing BOMs only show up in the deploy lifecycle with the central-publishing
      # extension, not in verify. skipPublishing=true uploads nothing; the dummy settings only supply the server entry.
      # -DskipEndtoend leaves the never-published end-to-end modules (and the runner of the 5.x compatibility suite) out.
      - name: Release deploy lifecycle without signing and publishing
        shell: bash  # -eo pipefail, so a failing Maven build is not hidden by tee
        run: ./mvnw -B -s .github/ci-dummy-settings.xml -P release -DskipEndtoend deploy -DskipTests -Dgpg.skip=true -DskipPublishing=true 2>&1 | tee release-dry-run.log

      - name: Check release artifacts
        run: scripts/ci/check-release-artifacts.sh release-dry-run.log
