name: CI-Build

on:
  push:
    branches-ignore: [ master ]
jobs:
  build:
    name: Build (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Prepare source directories for sonar
        run: |
          mkdir -p hamcrest-matcher-generator-annotationprocessor/src/{main,test}/{java,kotlin}
          mkdir -p hamcrest-matcher-generator-dependencies/src/{main,test}/{java,kotlin}
        if: success()

      - name: Build
        run: ./mvnw -B clean install -DskipTests
        if: success()

      - name: Test
        run: ./mvnw -B org.jacoco:jacoco-maven-plugin:prepare-agent verify org.jacoco:jacoco-maven-plugin:report org.jacoco:jacoco-maven-plugin:report-aggregate
        if: success()

      - name: Sonar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B sonar:sonar -am --projects "hamcrest-matcher-generator-annotationprocessor,hamcrest-matcher-generator-dependencies"
        if: success() && env.SONAR_TOKEN != ''
        continue-on-error: true

  build-java17:
    name: Verify (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-java17-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-java17

      - name: Build and Test (JDK 17)
        run: ./mvnw -B clean verify -Dkotlin.compiler.jvmTarget=17

  build-java25:
    name: Verify (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-java25-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-java25

      - name: Build and install all artifacts (JDK 21)
        # Kotlin 2.1.20 does not support running on JDK 25; build Kotlin modules with JDK 21
        run: ./mvnw -B clean install -DskipTests

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Test plain-java e2e module (JDK 25)
        # Verifies that the annotation processor generates valid Java 25 code
        # and that the generated matchers compile and pass tests on JDK 25.
        run: ./mvnw -B verify -pl hamcrest-matcher-generator-endtoend-plain-java-java25

      - name: Test Kotlin e2e modules (JDK 25 + Kotlin 2.2.0)
        # Kotlin 2.2.0 supports JDK 25 as compiler JVM; tests Kotlin-based Java 25 modules
        run: ./mvnw -B verify -Dkotlin.version=2.2.0
          -pl hamcrest-matcher-generator-endtoend-mixed-kotlin-java-java25,hamcrest-matcher-generator-endtoend-plain-kotlin-java25

  build-kotlin22:
    name: Verify (Kotlin 2.2.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-kotlin22-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-kotlin22

      - name: Build and Test (Kotlin 2.2.0)
        run: ./mvnw -B clean verify -Dkotlin.version=2.2.0

  build-kotlin23:
    name: Verify (Kotlin 2.3.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-kotlin23-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-kotlin23

      - name: Build and Test (Kotlin 2.3.0)
        run: ./mvnw -B clean verify -Dkotlin.version=2.3.0
