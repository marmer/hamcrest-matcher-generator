name: CI-Build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Build
        run: ./mvnw -B clean install -DskipTests
        if: success()

      - name: Test
        # The poms bind the JaCoCo agents and the reports Sonar reads (target/site/jacoco and jacoco-it) to the lifecycle.
        run: ./mvnw -B verify
        if: success()

  sonar:
    # Blocking: fails on a red quality gate (sonar.qualitygate.wait). Not a dependency of Build or the JDK matrix.
    name: Sonar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # pull-requests: read lets the analysis read the pull request it decorates; the job otherwise has contents: read only.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Validate SONAR_TOKEN
        # Runs before the build: a missing or rejected token fails here with the runbook link.
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python3 scripts/ci/check-sonar-token.py

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Prepare source directories for sonar
        run: |
          mkdir -p hamcrest-matcher-generator/src/{main,test}/{java,kotlin}
          mkdir -p matcher-generator-annotations/src/{main,test}/{java,kotlin}
          mkdir -p matcher-generator-core/src/{main,test}/{java,kotlin}
          mkdir -p assertj-assertion-generator/src/{main,test}/{java,kotlin}
          mkdir -p hamcrest-matcher-generator-kotlin/src/{main,test}/{java,kotlin}

      - name: Verify and analyse
        # One invocation: verify writes the JaCoCo reports Sonar reads; the scanner version is pinned in the root pom.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.qualitygate.wait=true -am --projects "hamcrest-matcher-generator,assertj-assertion-generator,hamcrest-matcher-generator-kotlin,matcher-generator-core,matcher-generator-annotations"

  verify-matrix:
    name: Verify JDK ${{ matrix.role }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: "17"
            java-version: "17"
          - role: "21"
            java-version: "21"
          - role: "25"
            java-version: "25"
          # Newest GA JDK. setup-java takes no "latest" alias; Renovate bumps this version (#134).
          - role: latest
            java-version: "27"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.role }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Verify
        run: ./mvnw -B clean verify

  mutation-testing:
    name: Mutation testing
    runs-on: ubuntu-latest
    # The build, verify-matrix and release-dry-run jobs set no timeout; sonar and this job do.
    # The full PIT run took 8:25 locally, so 60 min caps a hung minion.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Read the PIT version
        # The history cache key includes it: PIT history files are not compatible across PIT versions.
        run: echo "PIT_VERSION=$(sed -n 's|.*<pitest.version>\(.*\)</pitest.version>.*|\1|p' pom.xml | head -1)" >> "$GITHUB_ENV"

      - name: Restore PIT history
        # Pull requests analyse incrementally on the history the last push to main saved.
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/pit-history
          key: pit-history-${{ env.PIT_VERSION }}-${{ github.run_id }}
          restore-keys: pit-history-${{ env.PIT_VERSION }}-

      - name: Mutation testing
        # Push to main has no history to read, so every mutant is analysed (4 threads, set in the pom).
        run: ./mvnw -B -Pmutation verify

      - name: Save PIT history
        if: github.event_name == 'push' && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/pit-history
          key: pit-history-${{ env.PIT_VERSION }}-${{ github.run_id }}

      - name: Upload PIT reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pit-reports
          path: "**/target/pit-reports/**"
          if-no-files-found: warn

      - name: Mutation score per module
        if: always()
        # Lists the modules that run PIT (matcher-generator-annotations has no code to mutate, so it does not);
        # a module without a report fails this step.
        run: |
          {
            echo "## PIT mutation score (threshold 90 %)"
            python3 scripts/ci/pit-scores.py --threshold 90 --expect matcher-generator-core hamcrest-matcher-generator assertj-assertion-generator hamcrest-matcher-generator-kotlin
          } >> "$GITHUB_STEP_SUMMARY"

  release-dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      # The CycloneDX skip and the missing BOMs only show up in the deploy lifecycle with the central-publishing
      # extension, not in verify. skipPublishing=true uploads nothing; the dummy settings only supply the server entry.
      # -DskipEndtoend leaves the never-published end-to-end modules (and the runner of the 5.x compatibility suite) out.
      - name: Release deploy lifecycle without signing and publishing
        shell: bash  # -eo pipefail, so a failing Maven build is not hidden by tee
        run: ./mvnw -B -s .github/ci-dummy-settings.xml -P release -DskipEndtoend deploy -DskipTests -Dgpg.skip=true -DskipPublishing=true 2>&1 | tee release-dry-run.log

      - name: Check release artifacts
        run: scripts/ci/check-release-artifacts.sh release-dry-run.log
