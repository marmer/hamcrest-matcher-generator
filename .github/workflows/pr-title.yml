name: PR title

# The squash-merged PR title becomes the commit message on main, and release-please derives the version bump and the
# CHANGELOG from it, so it must follow Conventional Commits. The job name `PR title` is the required check.
on:
  pull_request_target:
    types: [ opened, edited, synchronize, reopened ]

permissions:
  contents: read

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # pull_request_target is safe here: the job checks out nothing and runs no code from the pull request.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
