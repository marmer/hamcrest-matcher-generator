name: External links

# Weekly check of the external links in the rendered docs (lychee job) and of the README badges (badges job).
# Non-blocking: a failing link opens or updates an issue; a broken badge fails the badges job red.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: Check external links
    runs-on: ubuntu-latest
    # issues: write only for the job that opens or updates the broken links issue.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Render docs
        run: ./mvnw -B -pl docs verify

      # Internal links are covered by the docs module tests. LinkedIn answers automated requests with HTTP 999.
      - name: Create report directory
        run: mkdir -p lychee

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --scheme https
            --scheme http
            --exclude 'linkedin\.com'
            --accept '200..=299,429'
            'docs/target/generated-docs/**/*.html'
          fail: false
          output: lychee/report.md

      - name: Open or update the broken links issue
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Broken external links in the docs
        run: |
          existing=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file lychee/report.md
          else
            gh issue create --title "$TITLE" --body-file lychee/report.md
          fi

  badges:
    name: Check the README badges
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A badge answering HTTP 400+ or saying "not found" (SonarCloud: HTTP 200 "Project not found") fails this job.
      - name: Check the README badges
        run: python3 scripts/ci/check-readme-badges.py
