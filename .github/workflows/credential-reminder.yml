name: Credential reminder

# Weekly check that the release and Sonar credentials still work and do not expire unnoticed (arc42 ch. 11, risk 1).
# An invalid token fails this run red with an explicit message; an expiry within 30 days opens or updates one issue
# that mentions the owner. The reminder dates for the Central token and the App key are the repository variables
# CENTRAL_TOKEN_EXPIRES_ON and RELEASE_APP_KEY_EXPIRES_ON (YYYY-MM-DD).

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credentials:
    name: Credential reminder
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Central token and the GPG key are environment secrets of the release environment.
    environment: release
    # issues: write opens or updates the renewal issue; the job otherwise has contents: read only.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python3 scripts/ci/check-sonar-token.py

      - name: Validate the Central Portal token
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: python3 scripts/ci/check-central-token.py

      - name: Check expiry dates and open or update the renewal issue
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          CENTRAL_TOKEN_EXPIRES_ON: ${{ vars.CENTRAL_TOKEN_EXPIRES_ON }}
          RELEASE_APP_KEY_EXPIRES_ON: ${{ vars.RELEASE_APP_KEY_EXPIRES_ON }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/ci/check-credential-expiry.py
