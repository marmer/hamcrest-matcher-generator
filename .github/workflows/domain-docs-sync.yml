name: "Domain docs sync"

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  domain-docs-sync:
    name: Domain docs in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check domain docs, required checks and CLAUDE.md references
        run: python3 scripts/agents/check-domain-docs-sync.py

      - name: Check the frozen 5.x compatibility suite is unchanged
        run: scripts/ci/check-frozen-5x-suite.sh

      - name: Check every module pom follows the version of the release-please manifest
        run: python3 scripts/ci/check-project-version.py

      - name: Check the README snippets are copied from the current example regions
        run: python3 scripts/ci/sync-readme-snippets.py --check

      - name: Check the workflows are SHA-pinned, have minimal permissions and cache Maven through setup-java
        run: python3 scripts/ci/check-workflow-hardening.py

      - name: Test the CI check scripts
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'

      - name: Test the agent scripts
        run: python3 -m unittest discover -s scripts/agents -p 'test_*.py'

      - name: Check the default branch ruleset requires only existing CI job names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash  # -eo pipefail, so a failing API call is not hidden by the pipe
        run: |
          default_branch=$(gh api repos/${{ github.repository }} --jq .default_branch)
          gh api "repos/${{ github.repository }}/rules/branches/$default_branch" | scripts/ci/check-ruleset-job-names.py

      - name: Check agent scripts with a shebang are executable in git
        run: |
          status=0
          for f in $(git ls-files 'scripts/*'); do
            if head -c2 "$f" | grep -q '^#!' && [ "$(git ls-files -s "$f" | cut -c1-6)" != "100755" ]; then
              echo "::error file=$f::has a shebang but no executable bit (git update-index --chmod=+x $f)"
              status=1
            fi
          done
          exit $status
