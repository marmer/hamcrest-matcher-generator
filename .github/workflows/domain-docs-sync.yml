name: "Domain docs sync"

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  domain-docs-sync:
    name: Domain docs in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check domain docs, required checks and CLAUDE.md references
        run: python3 scripts/agents/check-domain-docs-sync.py

      - name: Check the frozen 5.x compatibility suite is unchanged
        run: scripts/ci/check-frozen-5x-suite.sh

      - name: Test the CI check scripts
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'

      - name: Check the development ruleset requires only existing CI job names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash  # -eo pipefail, so a failing API call is not hidden by the pipe
        run: gh api repos/${{ github.repository }}/rules/branches/development | scripts/ci/check-ruleset-job-names.py

      - name: Check agent scripts with a shebang are executable in git
        run: |
          status=0
          for f in $(git ls-files 'scripts/*'); do
            if head -c2 "$f" | grep -q '^#!' && [ "$(git ls-files -s "$f" | cut -c1-6)" != "100755" ]; then
              echo "::error file=$f::has a shebang but no executable bit (git update-index --chmod=+x $f)"
              status=1
            fi
          done
          exit $status
