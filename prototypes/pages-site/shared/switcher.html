<!-- PROTOTYPE ONLY: variant switcher, not part of any design being evaluated -->
<style>
#proto-switch{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9999;display:flex;align-items:center;gap:4px;background:#111;color:#fff;font:600 13px/1 system-ui,sans-serif;border-radius:999px;padding:4px;box-shadow:0 4px 18px rgba(0,0,0,.35);white-space:nowrap}
#proto-switch a,#proto-switch span{color:#fff;text-decoration:none;padding:8px 12px;border-radius:999px}
#proto-switch a:hover,#proto-switch a:focus-visible{background:#333;outline:2px solid #fff;outline-offset:-2px}
#proto-switch .lbl{background:#e8b500;color:#111}
</style>
<nav id="proto-switch" aria-label="Prototype variant switcher"></nav>
<script>
(function () {
  var names = {a: 'A · Asciidoctor stock', b: 'B · Docs shell', c: 'C · One page'};
  var order = ['a', 'b', 'c'];
  var path = location.pathname;
  var m = path.match(/^(.*\/)([abc])\/(.*)$/);
  if (!m) return;
  var root = m[1], v = m[2], rest = m[3] || 'index.html';
  var kind = /^architecture\//.test(rest) ? 'arch' : /^guide/.test(rest) || (v === 'c' && location.hash) ? 'guide' : 'landing';
  var target = {
    landing: {a: 'index.html', b: 'index.html', c: 'index.html'},
    guide: {a: 'guide/getting-started.html', b: 'guide/getting-started.html', c: 'index.html#getting-started'},
    arch: {a: 'architecture/index.html', b: 'architecture/index.html', c: 'architecture/index.html'}
  }[kind];
  function go(d) { var n = order[(order.indexOf(v) + d + 3) % 3]; location.href = root + n + '/' + target[n]; }
  var bar = document.getElementById('proto-switch');
  bar.innerHTML = '<a href="#" data-d="-1" aria-label="Previous variant">&larr;</a><span class="lbl">' + names[v] +
    '</span><a href="#" data-d="1" aria-label="Next variant">&rarr;</a><a href="' + root + 'index.html">Overview</a>';
  bar.addEventListener('click', function (e) { var d = e.target.getAttribute('data-d'); if (d) { e.preventDefault(); go(+d); } });
  document.addEventListener('keydown', function (e) {
    if (e.target.closest('input,textarea,[contenteditable]')) return;
    if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1);
  });
})();
</script>
